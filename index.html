<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>vargames</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style type="text/css">
      @import url("https://fonts.googleapis.com/css2?family=Caprasimo&display=swap");
      body {
        width: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
        background: linear-gradient(-45deg, #eecc55, #55ee77, #55aaee);
        background-size: 400% 400%;
        animation: bganim 15s ease infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 80px;
      }
      h1 {
        font-family: "Caprasimo", serif;
        font-weight: 400;
        font-style: normal;
        color: white;
        text-shadow: #e58 3px 3px 0;
        animation: shadowanim 15s ease infinite;
      }
      @keyframes bganim {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }
      @keyframes shadowanim {
        0% {
          text-shadow: #e58 3px 3px 0;
        }
        25% {
          text-shadow: #e58 -3px 3px 0;
        }
        50% {
          text-shadow: #e58 -3px -3px 0;
        }
        75% {
          text-shadow: #e58 3px -3px 0;
        }
        100% {
          text-shadow: #e58 3px 3px 0;
        }
      }
      #portfolio {
        position: absolute;
        bottom: 10px;
        color: white;
        font-size: 2rem;
        font-weight: bold;
        display: flex;
        flex-direction: row;
        padding: 10px;
        background: rgba(255, 255, 255, 0.2);
      }
      #portfolio a {
        color: white;
        text-decoration: none;
        margin-right: 1rem;
      }
      #portfolio a:hover {
        text-shadow: #e58 3px 3px 0;
        animation: shadowanim 15s ease infinite;
      }
      #personal, #projects {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
    </style>
  </head>

  <body>
    <h1 class="vgtext">vargames</h1>
    <div id="portfolio">
      <div id="personal">
        <a href="https://linkedin.com/in/john-varga" class="vgtext" target="_blank">LinkedIn</a>
        <a href="https://github.com/ridespirals" class="vgtext" target="_blank">GitHub</a>
        <a href="https://drive.google.com/file/d/1qIDpskJEuEpJmA-DI-3FAA25hZgWy4Kg/view?usp=sharing" class="vgtext" target="_blank">Resume/CV</a>
      </div>
      <div id="projects">
        <a href="https://github.com/ridespirals/love-life" class="vgtext" target="_blank">Cellular Automata</a>
        <a href="https://github.com/ridespirals/vargames-name-gen" class="vgtext" target="_blank">IGDB Name Generator</a>
        <a href="https://github.com/ridespirals/fightsim" class="vgtext" target="_blank">Rock Paper Scissors fighter</a>
      </div>
    </div>
  </body>
</html>
